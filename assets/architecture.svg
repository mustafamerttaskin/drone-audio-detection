<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Başlık -->
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Drone Audio Detection — Sistem Mimarisi
  </text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">
    Akustik imzadan İHA tespiti: ön-işleme → öznitelik → model → tahmin
  </text>

  <!-- 1. Ham ses -->
  <rect x="40" y="100" width="180" height="80" rx="10" fill="url(#g1)"/>
  <text x="130" y="130" text-anchor="middle" fill="white" font-size="14" font-weight="600">Ham Ses Girişi</text>
  <text x="130" y="152" text-anchor="middle" fill="#cbd5e1" font-size="11">.wav / .mp3 / .flac</text>
  <text x="130" y="168" text-anchor="middle" fill="#cbd5e1" font-size="11">değişken uzunluk</text>

  <!-- Ok -->
  <line x1="220" y1="140" x2="270" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Ön-işleme -->
  <rect x="270" y="100" width="200" height="80" rx="10" fill="url(#g2)"/>
  <text x="370" y="128" text-anchor="middle" fill="white" font-size="14" font-weight="600">Ön-İşleme</text>
  <text x="370" y="148" text-anchor="middle" fill="#e0f2fe" font-size="11">• Mono + 22050 Hz</text>
  <text x="370" y="163" text-anchor="middle" fill="#e0f2fe" font-size="11">• 2.0 sn sabit uzunluk</text>
  <text x="370" y="176" text-anchor="middle" fill="#e0f2fe" font-size="11">• Augmentasyon (eğitimde)</text>

  <!-- Ok (dallanma) -->
  <line x1="470" y1="140" x2="530" y2="140" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="140" x2="530" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="140" x2="530" y2="220" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="90" x2="580" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="220" x2="580" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3a. MFCC yolu -->
  <rect x="580" y="60" width="200" height="70" rx="10" fill="url(#g3)"/>
  <text x="680" y="88" text-anchor="middle" fill="white" font-size="13" font-weight="600">MFCC + Spektral</text>
<text x="680" y="106" text-anchor="middle" fill="#ede9fe" font-size="11">Ortalama &amp; std sapması</text>
  <text x="680" y="122" text-anchor="middle" fill="#ede9fe" font-size="11">1B vektör (264-boyut)</text>

  <!-- 3b. Mel spektrogram yolu -->
  <rect x="580" y="190" width="200" height="70" rx="10" fill="url(#g3)"/>
  <text x="680" y="218" text-anchor="middle" fill="white" font-size="13" font-weight="600">Log-Mel Spektrogram</text>
  <text x="680" y="236" text-anchor="middle" fill="#ede9fe" font-size="11">64 mel × T zaman çerçevesi</text>
  <text x="680" y="252" text-anchor="middle" fill="#ede9fe" font-size="11">z-score normalize</text>

  <!-- Ok -->
  <line x1="780" y1="95" x2="830" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="225" x2="830" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4a. SVM -->
  <rect x="830" y="60" width="140" height="70" rx="10" fill="url(#g4)"/>
  <text x="900" y="88" text-anchor="middle" fill="white" font-size="13" font-weight="600">RBF-SVM</text>
  <text x="900" y="106" text-anchor="middle" fill="#d1fae5" font-size="11">Baseline (klasik ML)</text>
  <text x="900" y="122" text-anchor="middle" fill="#d1fae5" font-size="11">StandardScaler</text>

  <!-- 4b. CNN -->
  <rect x="830" y="190" width="140" height="70" rx="10" fill="url(#g4)"/>
  <text x="900" y="218" text-anchor="middle" fill="white" font-size="13" font-weight="600">CNN (PyTorch)</text>
  <text x="900" y="236" text-anchor="middle" fill="#d1fae5" font-size="11">4 conv bloğu + GAP</text>
  <text x="900" y="252" text-anchor="middle" fill="#d1fae5" font-size="11">~590K parametre</text>

  <!-- Ok - birleşim -->
  <line x1="900" y1="130" x2="900" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="900" y1="260" x2="900" y2="290" stroke="#64748b" stroke-width="2"/>
  <line x1="900" y1="160" x2="500" y2="160" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="900" y1="290" x2="500" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="500" y1="160" x2="500" y2="380" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="500" y1="290" x2="500" y2="380" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="500" y1="380" x2="500" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Tahmin -->
  <rect x="360" y="410" width="280" height="90" rx="10" fill="url(#g1)"/>
  <text x="500" y="440" text-anchor="middle" fill="white" font-size="15" font-weight="600">Tahmin</text>
  <text x="500" y="462" text-anchor="middle" fill="#cbd5e1" font-size="12">Softmax olasılıkları</text>
  <text x="500" y="480" text-anchor="middle" fill="#cbd5e1" font-size="12">→ CLI &#160; ● &#160; Streamlit web arayüzü</text>
  <text x="500" y="496" text-anchor="middle" fill="#cbd5e1" font-size="12">→ Python API (Predictor)</text>

  <!-- Alt bilgi -->
  <text x="500" y="540" text-anchor="middle" font-size="11" fill="#94a3b8">
    Metrikler: Accuracy • Precision • Recall • F1 • ROC-AUC • Confusion Matrix
  </text>
</svg>
