audio:
  sample_rate: 22050
  duration_sec: 2.0
  n_fft: 2048
  hop_length: 512
  n_mels: 64
  n_mfcc: 40
  fmin: 20
  fmax: 11025
paths:
  data_root: data/raw
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
  stratify: true
training:
  batch_size: 32
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 8
  device: auto
augmentation:
  enabled: true
  noise_prob: 0.5
  noise_snr_db:
  - 10
  - 25
  time_shift_prob: 0.5
  pitch_shift_prob: 0.3
  pitch_shift_semitones:
  - -2
  - 2
classes:
- not_drone
- drone
